services:
  app:
    build:
      context: .
    image: mockmate
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: development
    develop:
      watch:
        - action: sync
          path: .
          target: /app
          ignore:
            - node_modules/
            - .next/
        - action: rebuild
          path: package.json
